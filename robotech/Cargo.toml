[package]
name = "robotech"
version = "1.16.0"
edition = "2024"
authors = ["zbz"]
keywords = ["crud", "microservice", "service", "RESTful"]
description = "Backend service implementation for the RoboTech platform, providing RESTful APIs and business logic for web applications."
categories = ["web-programming::http-server"]
license = "MIT"
homepage = "https://github.com/rusthing/robotech-rs"
repository = "https://github.com/rusthing/robotech-rs"
readme = "README.md"

[features]
# ============ 基础能力 ============
# 应用级配置与生命周期（AppWatcher / LogWatcher / SignalManager / SvcError / bootstrap! 依赖）
app = ["dep:validator", "dep:idworker"]
# 过程宏（bootstrap! / log_call / dao / svc / ctrl / router / api_doc / crud_dto / vo / dic ...）
macros = ["dep:robotech-macros"]

# ============ 可选能力（相互正交，按需开启）============
# OpenAPI schema：U8/U16/U32/U64/U128、Duration、Ro、RoResult、PageRx 的 ToSchema 实现，
# 以及 `#[vo]` / `#[crud_dto]` / `#[dic]` 生成代码所需的类型支持。
# `web` 与 `api-client` 会隐含开启。
openapi = ["dep:utoipa"]
# sea-orm 类型互操作：U64 / Duration 与 sea-orm `Value` / `TryGetable` / `ValueType` 的互转，
# 以及检索参数翻译（`bean_searcher_utils` 的 `Condition` / `Expr` / `Value`）所需的 sea-orm 本体。
# `db` 会隐含开启；不使用 `db` 但需要这些互操作或检索翻译的场景（如 `*-api` 的 `server` feature）
# 可单独开启 `robotech/orm`。
orm = ["dep:sea-orm"]

# ============ 数据访问 ============
db = ["app", "orm", "dep:sqlx", "dep:regex", "dep:once_cell", "dep:linkme"]

# ============ Web / 微服务 ============
web = ["app", "openapi", "dep:axum", "dep:utoipa-swagger-ui", "dep:linkme", "dep:ipnet", "dep:tower", "dep:tower-http", "dep:tokio-rustls", "dep:hyper", "dep:hyper-util", "dep:rustls-pemfile", "dep:socket2", "dep:reqwest"]
config-center = ["dep:base64", "dep:etcd-client", "dep:nacos-sdk", "dep:toml"]
registry-center = ["web", "dep:base64", "dep:etcd-client", "dep:nacos-sdk"]
feign = ["api-client", "registry-center"]
api-client = ["openapi", "dep:reqwest", "dep:http", "dep:jsonwebtoken"]

# ============ 消息队列 / 缓存 / 时序库 ============
mqtt = ["dep:rumqttc", "dep:bytes"]
nats = ["dep:async-nats", "dep:futures", "dep:bytes"]
rabbitmq = ["dep:lapin", "dep:futures", "dep:bytes"]
redis = ["dep:redis"]
influxdb = ["dep:influxdb", "dep:reqwest"]
# 刷新信号：基于 JetStream 的变更广播 + 订阅自愈（不依赖缓存，可单独使用）
refresh = ["nats"]
local-cache = ["refresh"]
distributed-cache = ["redis"]

[dependencies]
log = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-core = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "chrono", "tracing-log"] }
config = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
chrono = { workspace = true }
derive_setters = { workspace = true }
typed-builder = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
nix = { workspace = true }
notify = { workspace = true }
# 以下三个按 feature 开启：utoipa（openapi）/ utoipa-swagger-ui（web）/ sea-orm（orm，db 隐含）
utoipa = { workspace = true, optional = true }
utoipa-swagger-ui = { workspace = true, features = ["axum", "vendored"], optional = true }
linkme = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
axum = { workspace = true, optional = true, features = ["multipart", "macros"] }                  # Web框架
tower = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["cors", "trace", "fs"], optional = true }          # axum常用中间件集合 (CORS, 日志, 静态文件服务, 追踪等)
rustls-pemfile = { workspace = true, optional = true }
tokio-rustls = { workspace = true, features = ["aws-lc-rs"], optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
validator = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["multipart", "json", "stream", "query"], optional = true }
http = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
rumqttc = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
influxdb = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
etcd-client = { workspace = true, optional = true }
nacos-sdk = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
redis = { workspace = true, features = ["tokio-comp", "streams"], optional = true }
async-nats = { workspace = true, optional = true }
lapin = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

idworker = { workspace = true, optional = true }
wheel-rs = { workspace = true }

robotech-macros = { workspace = true, optional = true }
ulid = "1.2.1"